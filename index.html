<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#2F6B57">
  <title>Creating Happiness App</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-512.png">
  <style>
    html, body { margin: 0; height: 100%; background: #F6F3EE; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
  </style>

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    // TODO: /exec-URL deines Apps-Script-Deployments eintragen
    var APP_URL = "HIER_DEINE_APPS_SCRIPT_EXEC_URL";

    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function (OneSignal) {
      await OneSignal.init({
        appId: "5c90f282-c749-4fa2-b32f-104238321cba",
        safari_web_id: "web.onesignal.auto.0c986762-0fae-40b1-a5f6-ee95f7275a97",
        notifyButton: { enable: true }
      });
      // Mitarbeiter-ID aus der App (iframe) -> Gerät dem Nutzer zuordnen
      window.addEventListener("message", function (e) {
        if (!e.data || e.data.type !== "cdg-user") return;
        if (e.data.id) OneSignal.login(e.data.id); else OneSignal.logout();
      });
    });

    window.addEventListener("DOMContentLoaded", function () {
      // Parameter wie ?k=… (Login) an die App weiterreichen
      var q = location.search || "";
      document.getElementById("app").src = APP_URL + q;
    });
  </script>
</head>
<body>
  <iframe id="app" allow="autoplay; clipboard-write" title="Creating Happiness App"></iframe>
</body>
</html>
