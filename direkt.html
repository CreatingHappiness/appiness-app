<style>
:root{--bg:#F6F3EE;--card:#FFFFFF;--line:#E3DED5;--line2:#EFEAE1;--ink:#1E1D1A;--muted:#5E5A52;--soft:#8A857B;--acc:#2F6B57;--acc2:#E2EEE9;--warn:#FFF4DE;--warnline:#EED9A8;--red:#B23A26;--blue:#2D5BA8;--dark:#1E1D1A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
button{cursor:pointer}
a{color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 110px}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
h2{margin:0;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.muted{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.btn{height:50px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:800;padding:0 18px;width:100%}
.btn:disabled{background:#A9A398}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:700}
.btn.danger{background:transparent;border:1px solid var(--line);color:#8A1F11;font-weight:700}
.input{width:100%;height:52px;border:1px solid var(--line);border-radius:14px;padding:0 14px;background:#fff;outline:none}
.input:focus{border-color:var(--acc)}
textarea.input{height:140px;padding:12px 14px;resize:vertical}
.err{color:#8A1F11;background:#FBEAE6;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.info{color:#1F3F78;background:#E5ECF7;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.45}
.badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;white-space:nowrap}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:8px;margin-bottom:16px}
.avatar{width:48px;height:48px;border-radius:24px;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;border:0;flex:none}
.back{display:flex;align-items:center;gap:6px;border:0;background:none;padding:6px 0;font-weight:700;color:var(--muted);margin-bottom:6px}
/* Startseite */
.grid2{display:grid;gap:14px}
.today{background:var(--warn);border:1px solid var(--warnline);border-radius:18px;padding:6px 16px}
.today .row{min-height:52px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--warnline);padding:8px 0}
.today .row:first-of-type{border-top:0}
.today .row b{font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.tile{min-height:120px;padding:14px;border-radius:20px;border:1px solid var(--line);background:#fff;text-align:left;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
.tile.dark{background:var(--dark);border-color:var(--dark);color:#fff}
.tile .ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px}
.tile .t{font-size:17px;font-weight:800}
.tile .s{font-size:12px;color:var(--muted);line-height:1.35}
.tile.dark .s{color:#CFCAC0}
/* Listen */
.list{display:flex;flex-direction:column;overflow:hidden}
.li{min-height:58px;padding:10px 16px;display:flex;align-items:center;gap:12px;border-top:1px solid var(--line2);background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:15px}
.li .tx span{font-size:12px;color:var(--muted)}
.group{margin-top:16px}
.group h2{margin:0 4px 8px}
/* Mitteilungen */
.msg{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.msg.unread{border-color:#A9BEE0;box-shadow:inset 4px 0 0 var(--blue)}
.msg .meta{font-size:12px;color:var(--soft)}
.msg .body{white-space:pre-wrap;font-size:15px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:#F1EDE6;color:var(--muted)}
.chip.on{background:var(--acc2);color:#1F4D3E}
/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(70px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:5}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.nav button.on{color:var(--acc);font-weight:800}
.nav .dot{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.overlay{position:fixed;inset:0;background:rgba(30,29,26,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:80vh;overflow:auto;padding:18px 18px 28px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:10}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.loginbox{width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s 0.8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
/* Inventur (Modul 2A) */
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:#E9E4DB;border-radius:12px}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg button{height:38px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:700;font-size:14px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;-webkit-overflow-scrolling:touch}
.cbtn{flex:none;height:36px;padding:0 13px;border:1px solid var(--line);border-radius:18px;background:#fff;font-size:13px;font-weight:700;white-space:nowrap}
.cbtn.on{background:var(--dark);border-color:var(--dark);color:#fff}
.ihead{display:grid;grid-template-columns:minmax(0,1fr) 104px 104px;gap:6px;padding:12px 12px 4px 30px;font-size:11px;font-weight:800;color:var(--muted);text-align:center}
.ihead span:first-child{text-align:left}
.igroup{margin-top:10px;overflow:hidden}
.igroup h3{margin:0;padding:8px 12px;background:#F1EDE6;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;gap:8px}
.igroup h3 span{font-weight:600;color:var(--muted);text-transform:none;letter-spacing:0}
.pad{padding:16px}
.irow{display:grid;grid-template-columns:12px minmax(0,1fr) 104px 104px;gap:6px;align-items:center;padding:8px 12px;border-top:1px solid var(--line2)}
.irow.h{grid-template-columns:12px minmax(0,1fr) auto}
.irow.a{grid-template-columns:12px minmax(0,1fr) auto 104px}
.irow.g{grid-template-columns:12px minmax(0,1fr);row-gap:6px}
.irow.g .ctl{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-left:18px}
.irow.g .ctl>div{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.irow.g .ctl label{font-size:11px;font-weight:700;color:var(--muted);padding-left:4px}
.irow.g .stp{justify-content:flex-start}
.irow:first-of-type{border-top:0}
.nm{min-width:0;display:flex;flex-direction:column;gap:1px}
.nm b{font-size:14px;line-height:1.25}
.nm span{font-size:11px;color:var(--muted);line-height:1.3}
.dt{width:11px;height:11px;border-radius:6px;display:block}
.dt.empty{border:2px solid #C9C2B5;width:7px;height:7px}
.stp{display:flex;align-items:center;justify-content:center;gap:2px;padding:2px;border-radius:10px}
.stp button{width:32px;height:38px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:18px;font-weight:700;padding:0}
.stp .v{min-width:32px;text-align:center;font-size:16px;font-weight:800}
.stp.big button{width:42px;height:42px}
.stp.ord.auto{background:#FBF3DD}
.stp.ord.man{background:#E5ECF7}
.stp.ord.man .v{color:var(--blue)}
.stp.sm{padding:0;gap:1px}
.stp.sm button{width:28px;height:34px;font-size:16px}
.stp.sm .v{min-width:36px;font-size:13px}
.gen{height:38px;padding:0 9px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:11px;font-weight:800;color:var(--muted)}
.gen.on{background:var(--acc2);border-color:var(--acc);color:#1F4D3E}
.prog{position:sticky;bottom:calc(78px + env(safe-area-inset-bottom));margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 6px 18px rgba(30,29,26,.08);z-index:3}
.prog .pl{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.prog .pl span{color:var(--muted)}
.prog .bar{display:block;height:7px;border-radius:4px;background:var(--line);margin-top:7px;overflow:hidden}
.prog .bar span{display:block;height:7px;background:var(--acc)}
.prow{padding:12px;margin-top:8px;display:flex;flex-direction:column;gap:8px}
.prow.low{border-color:#E8C26A}
.prow .ph{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.prow .ph b{font-size:15px}
.prow .ph span{font-size:11px;font-weight:700;text-align:right}
.pg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pc{border:1px solid var(--line);border-radius:10px;padding:4px 2px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.pc.on{background:#FBF3DD}
.pc>span:first-child{font-size:10px;font-weight:800;color:var(--muted)}
.orow{display:grid;grid-template-columns:30px minmax(0,1fr) 104px;gap:6px;align-items:center;padding:6px 12px;border-top:1px solid var(--line2);font-size:12px}
.orow span{color:var(--muted)}
.form{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.form label.ck{flex-direction:row;align-items:center;gap:10px;font-size:14px;color:var(--ink)}
.form label.ck input{width:22px;height:22px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hist{padding:4px 16px 12px;display:flex;flex-direction:column;gap:2px;font-size:12px}
.hist div{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:6px;padding:4px 0;border-top:1px solid var(--line2)}
.week{display:flex;flex-direction:column;gap:6px}
.week div{display:flex;gap:10px;font-size:14px;align-items:baseline}
.week div b{width:28px}
.week div.on{color:var(--acc);font-weight:700}
.mitw{font-weight:400;color:var(--muted);font-size:12.5px;line-height:1.4}.mitw i{font-style:normal;opacity:.8}.week div.on .mitw{color:var(--muted)}
.oarow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid #EEE9E0}.oarow.on{background:#F4F8EE}.oan{display:flex;flex-direction:column;min-width:0}.oan small{color:var(--muted);font-size:12px}
@media (max-width:380px){.ihead{grid-template-columns:minmax(0,1fr) 96px 96px}.irow{grid-template-columns:12px minmax(0,1fr) 96px 96px}.stp button{width:29px}.stp .v{min-width:28px}}
@media (min-width:1000px){.prog{bottom:12px}}
.srow{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 4px;border-top:1px solid var(--line2);background:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
.srow:first-child{border-top:0}
.srow .grip{width:40px;height:40px;flex:none;display:flex;align-items:center;justify-content:center;touch-action:none;color:var(--soft);font-size:22px}
.srow.ph{opacity:.35;background:#E5ECF7}
.srow.ghost{position:fixed;z-index:20;pointer-events:none;box-shadow:0 12px 28px rgba(30,29,26,.22);border-radius:12px;border:1px solid var(--line);opacity:.97}
.sgroup .sbody{min-height:48px}
.sollbtn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:1px 6px;font-size:11px;font-weight:700;color:var(--blue);margin-right:2px}
.solled{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0 2px 18px;font-size:12px;font-weight:700;color:var(--muted)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.tools .btn{height:42px}
.rmv{height:38px;padding:0 10px;border:1px solid #E8B9AF;border-radius:9px;background:#FBEAE6;color:#8A1F11;font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:4px}
.irow.g .ctl.one{display:flex;justify-content:flex-end}
.ph2{display:flex;align-items:center;gap:10px}
.ph2>b{flex:1;font-size:16px}
.tot{padding:6px 12px;border-radius:12px;display:flex;flex-direction:column;align-items:flex-end}
.tot span{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.tot b{font-size:20px;line-height:1.05}
.tot.miss{background:var(--dark);color:#fff}
.tot.ok{background:var(--acc2);color:#1F4D3E}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchips span{padding:3px 8px;border-radius:8px;font-size:11px;font-weight:700;background:var(--bg);color:var(--soft)}
.pchips span.y{background:#FBF3DD;color:#7A5200}
.pchips span.g{background:var(--acc2);color:#1F4D3E}
.addsite{height:36px;padding:0 6px;border:1px dashed #A9A398;border-radius:8px;background:#fff;font-size:11px;font-weight:700;color:var(--muted)}
/* ===== Design wie Entwurf „Inventur Bar & Produktion“ (5B) ===== */
.vh{display:flex;align-items:center;gap:4px;margin:0 0 6px -8px}
.vback{width:44px;height:44px;flex:none;border:0;background:none;border-radius:22px;display:flex;align-items:center;justify-content:center;padding:0}
.vt{flex:1;min-width:0;display:flex;flex-direction:column}
.vt h1{font-size:20px;font-weight:800;letter-spacing:0;line-height:1.2}
.vt span{font-size:12px;color:var(--muted)}
.vedit{flex:none;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:13px;font-weight:800}
.vedit.ic{width:40px;padding:0;display:flex;align-items:center;justify-content:center}
.vedit.on{background:var(--dark);border-color:var(--dark);color:#fff}
.vsites{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.vhint{font-size:11px;color:var(--muted);line-height:1.35}
.seg button{height:36px;font-size:13px}
.vprog{margin:4px 0 6px;display:flex;flex-direction:column;gap:5px}
.vprog>div{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:700}
.vprog>div span{color:var(--muted)}
.vprog .bar{display:block;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.vprog .bar span{display:block;height:8px;background:var(--acc)}
.vcols{display:grid;grid-template-columns:minmax(0,1fr) 104px 104px;gap:6px;padding:4px 10px;font-size:11px;font-weight:800;color:var(--muted);text-align:center}
.vcols span:first-child{text-align:left}
.vgrp{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:10px}
.vgrp h3{margin:0;padding:6px 10px;background:#F1EDE6;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between;gap:8px}
.vgrp h3 span{font-size:11px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) 104px 104px;gap:6px;padding:6px 10px;align-items:center;border-top:1px solid var(--line2)}
.vrow:first-of-type{border-top:0}
.vrow .vrm{grid-column:2/4;display:flex;justify-content:flex-end}
.vnm{display:flex;align-items:center;gap:6px;min-width:0}
.vnm>div{display:flex;flex-direction:column;min-width:0}
.vnm b{font-size:13px;font-weight:700;line-height:1.2}
.vnm span{font-size:10px;color:var(--muted)}
.vdot{width:10px;height:10px;flex:none;border-radius:5px;display:block}
.vdot.big{width:12px;height:12px;border-radius:6px}

/* ===== Fahrtenbuch & Ansicht anpassen ===== */

.fbcard{width:100%;margin-top:10px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;gap:10px;text-align:left;color:var(--ink)}

.fbstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fbstats>div{display:flex;flex-direction:column}
.fbstats b{font-size:17px;font-weight:800}
.fbstats span{font-size:11px;color:var(--muted)}
.fbbar{height:8px;border-radius:4px;background:#EFEAE1;display:flex;overflow:hidden}

.fbhero{background:#1F3A31;color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px}

.fbhero>small{font-size:13px;color:#CFE2DA}
.fbrow{width:100%;padding:10px 14px;display:flex;align-items:center;gap:10px;border:0;border-top:1px solid var(--line2);background:#fff;text-align:left;color:var(--ink)}

.fbrow:disabled{cursor:default;opacity:1}
.fbrow .vtx b{font-size:14px;font-weight:700}
.fbday{width:38px;flex:none;display:flex;flex-direction:column;align-items:center}
.fbday b{font-size:16px;font-weight:800}
.fbday span{font-size:10px;color:var(--muted)}
.fbkm{font-size:14px;white-space:nowrap}
.fbl{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.fbkmin{font-weight:800;border-color:var(--acc)}
.fbcalc{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);background:#F3F8F5;border-radius:10px;padding:8px 10px}
.fbcalc b{color:var(--ink)}
.fbap{display:flex;flex-direction:column;gap:8px}
.fbapmain{width:100%;padding:14px 16px;background:#fff;border:2px solid var(--acc);border-radius:16px;display:flex;align-items:center;gap:12px;text-align:left;color:var(--ink)}
.fbapmain .vic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.fbapmain .vtx b{font-size:16px;font-weight:800}
.aphid{width:100%;margin-top:16px;border:1px dashed #A9A398;border-radius:12px;padding:11px 12px;background:none;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;text-align:left}
.aphid b{color:var(--ink)}
.aphid>span:last-child{font-weight:700;color:var(--acc)}
.aparow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line2)}
.aparow:first-child{border-top:0}
.aparow.off .vtx b{color:var(--soft)}
.apmv{display:flex;flex-direction:column;gap:2px}
.apmv button{width:32px;height:22px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:10px;color:var(--muted);padding:0}

.tgl{width:50px;height:30px;border-radius:15px;border:0;background:#D8D2C7;position:relative;padding:0;flex:none}
.tgl i{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .15s}
.tgl.on{background:var(--acc)}

.fbl input{min-width:0;width:100%;box-sizing:border-box}
.hrcard .vbtn2>input{min-width:0;width:100%;box-sizing:border-box}
.fbl select{width:100%;min-width:0;box-sizing:border-box;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:#fff}

/* ===== Zentralproduktion ===== */
.wrap.zpw{max-width:1320px}

.zptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.zpsearch{flex:1 1 220px;min-width:0;height:42px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:16px;background:#fff}

.zpchip{height:36px;border-radius:999px;border:1px solid var(--line);background:#fff;padding:0 12px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap}

.zplbl{font-size:12px;color:var(--muted);font-weight:700;margin-left:2px}

.zplist{min-width:0}

.zpt.sm{font-size:13px}
.zpt.sm td{padding:7px 10px}
.zpth{background:none;border:0;padding:4px 0;font:inherit;font-weight:800;color:inherit;text-transform:inherit;letter-spacing:inherit;white-space:nowrap}
.zpth.on{color:#12665B}
.zpfrh{text-align:right;border-left:1px solid var(--line2)}
.zpfrc{border-left:1px solid var(--line2);width:1px;padding:0!important}
.zpfrbtn{border:1px solid var(--line);background:#F6F5F1;border-radius:999px;height:32px;padding:0 10px;font:inherit;font-size:12px;font-weight:700;color:var(--ink);text-transform:none;letter-spacing:0}

.zpb.ok{background:#E3F2E8;color:#1E6B40}.zpb.warn{background:#FBEFD4;color:#7A4F00}.zpb.no{background:#FBE4E1;color:#A61E14}.zpb.grey{background:#EFEDE7;color:#5E5A52}.zpb.est{background:#FDE8D7;color:#9A3B00}
.estt{color:#9A3B00}
.zpdet{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;margin-top:12px}

.zpsub{font-size:13px;color:var(--muted);margin-top:-6px}
.zpclose{align-self:flex-start;background:none;border:0;padding:4px 0;font:inherit;font-size:14px;font-weight:700;color:#12665B}
.zpkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.zpkpis>div{background:#F6F5F1;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.zpkpis>div.good{background:#E2F0ED}.zpkpis>div.bad{background:#FBE4E1}
.zpkpis span{font-size:12px;color:var(--muted)}
.zpkpis b{font-size:20px;font-weight:800}
.zpkpis small{font-size:11px;color:var(--muted)}
.zpvk{display:flex;align-items:center;gap:6px}
.zpvk button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px}
.zpbox{border-top:1px solid var(--line2);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.zpbh{font-size:13px;font-weight:800;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.zpbh small{font-size:12px;font-weight:600;color:var(--muted)}
.zpkv{display:flex;justify-content:space-between;gap:12px;font-size:14px;padding:4px 0}
.zpkv span{color:var(--ink);min-width:0}
.zpkv b{font-weight:700;white-space:nowrap;text-align:right}
.zpkv.zptot{border-top:1px solid var(--line2);margin-top:4px;padding-top:8px;font-size:15px;font-weight:800}
.zpkv.zptot b{color:#0B4A42}
.zphint{font-size:12px;color:#5E5A52;background:#F6F5F1;border-radius:10px;padding:8px 10px;margin-top:4px}
.zphint.bad{background:#FBE4E1;color:#8A1F11}.zphint.est{background:#FDF3EA;color:#9A3B00}
.zpals{display:flex;flex-wrap:wrap;gap:6px}
.zpal{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#FBE4E1;color:#A61E14}
.zpal.none{background:#E3F2E8;color:#1E6B40}.zpal.unk{background:#EFEDE7;color:#5E5A52;font-weight:600}
.zpnut{display:flex;flex-direction:column}
.zpnh{font-size:13px;font-weight:800;margin-bottom:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.zpnr{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;border-top:1px solid var(--line2)}
.zpnr.sub{padding-left:14px;color:var(--muted)}
.zpnr.est b{color:#9A3B00}
.zplab{border:1px dashed #B9B4A9;border-radius:8px;padding:10px;text-align:center;font-family:Arial,Helvetica,sans-serif;font-size:12px;display:flex;flex-direction:column;gap:4px}
.zplab>b{font-size:18px;color:#E04A0A}
.zpused{display:flex;flex-wrap:wrap;gap:6px}
.zpused button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font:inherit;font-size:12px;font-weight:600;color:var(--ink);text-align:left}
.zpnote{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 2px 0}
.zpnote b{color:var(--ink)}
.zpprice{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.zpprice section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.zpprice h3{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.zpchk{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:8px;overflow:hidden}
.zpchkh{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;font:inherit;text-align:left;color:var(--ink)}
.zpchkh>i{width:12px;height:12px;border-radius:6px;flex:none}

.zpchkh>span{flex:1;min-width:0;display:flex;flex-direction:column}
.zpchkh small{font-size:12px;color:var(--muted)}
.zpchkh em{font-style:normal;font-size:20px;font-weight:800}
.zpchki{border-top:1px solid var(--line2);display:flex;flex-direction:column}
.zpchki button{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border:0;border-top:1px solid var(--line2);background:none;font:inherit;font-size:13px;text-align:left;color:var(--ink)}
.zpchki button:first-child{border-top:0}
.zpchki small{color:var(--muted);white-space:nowrap}
.zpstamm{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.zpstamm .zpbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.zpsw{display:inline-block;width:22px;height:22px;border-radius:6px;border:1px solid var(--line)}
@media (max-width:899px){

}

  .zpgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr);gap:14px;align-items:start}

}

.sml{display:none}

}
.zpt td.r{white-space:nowrap}
.zpfin{color:#1E6B40;font-weight:800;font-size:12px}

<script>
/* =====================================================================

var S = { token: null, me: null, page: 'start', tile: null, msgs: [], open: {}, email: '', today: { week: [], tasks: [], site: '' }, inv: {} };

/* ---------- Speicher (falls blockiert: nur im Speicher) ---------- */
function getStore(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
function setStore(k, v) {
  try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {}
  /* Vers2-99: Die App läuft im Rahmen der Push-Seite (iframe). Dort löscht das Handy den Speicher oft nach Stunden.

  var dev = false; try { localStorage.setItem('cdg_t', '1'); dev = localStorage.getItem('cdg_t') === '1'; } catch (e) {}

  if (id === PUSH_LAST) return;
  PUSH_LAST = id;

}

/* ---------- Server ---------- */
function call(action, data) {
  if (SPN.pin && /^sp[A-Z]/.test(action)) SPN.t = Date.now();
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok) return resolve(r.data);
        if (r && r.code === 'AUTH') { logoutLocal(); return reject(new Error('Bitte neu anmelden.')); }
        reject(new Error(r && r.msg ? r.msg : 'Fehler'));
      })
      .withFailureHandler(function () { reject(new Error('Keine Verbindung. Bitte nochmal versuchen.')); })
      .api({ action: action, token: S.token, data: spPinData(action, data), as: S.viewAsKey || '' });
  });

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }

function initials(me) { var s = (me.alias || me.vorname || '?').replace(/[^A-Za-zÄÖÜäöüß ]/g, ' ').trim().split(/\s+/); return (s.length > 1 ? s[0][0] + s[1][0] : s[0].slice(0, 2)).toUpperCase(); }

/* Vers2.44 Tempo: letzten Stand sofort zeigen, im Hintergrund aktualisieren */

/* Login prüfen: bei Verbindungsfehler bis zu 3 Versuche, danach „nochmal versuchen“ – nie einfach abmelden */
function tryTokens(list, i, attempt) {

    .withSuccessHandler(function (r) {

        S.cached = false; setStore('cdg_token', S.token); setUrlKey(S.token);
        render(); cacheSave(); return;
      }
      if (r && r.code === 'AUTH') {
        if (i + 1 < list.length) return tryTokens(list, i + 1, 0);
        return logoutLocal();
      }
      offline(list, i, attempt);
    })
    .withFailureHandler(function () { offline(list, i, attempt); })
    .api({ action: 'boot', token: S.token, data: {} });

function logoutLocal() { S.token = null; S.me = null; setStore('cdg_token', null); setStore('cdg_cache', null); setUrlKey(null); pushBridge(null); renderLogin(); }

/* ---------- Login ---------- */
function renderLogin(step, errMsg) {
  var codeStep = step === 'code';
  $('app').innerHTML =
    '<div class="center"><div class="loginbox">' +
    '<div style="width:56px;height:56px;border-radius:16px;background:var(--acc);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center">CDG</div>' +
    '<h1>' + (codeStep ? 'Code eingeben' : 'Willkommen') + '</h1>' +
    '<div class="muted" style="font-size:15px;line-height:1.45">' + (codeStep
      ? 'Falls die Adresse bei uns hinterlegt ist, haben wir dir einen 6-stelligen Code an <b>' + esc(S.email) + '</b> geschickt.'
      : 'Melde dich mit deiner E-Mail-Adresse an. Du bekommst einen Code per E-Mail.') + '</div>' +
    (codeStep
      ? '<input id="code" class="input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" style="font-size:24px;letter-spacing:.3em;text-align:center">' +
        '<button id="go" class="btn">Anmelden</button>' +
        '<button id="back" class="btn ghost">Andere E-Mail / neuen Code</button>'
      : '<input id="mail" class="input" type="email" autocomplete="email" placeholder="name@beispiel.de" value="' + esc(S.email) + '">' +
        '<button id="go" class="btn">Code anfordern</button>') +
    (errMsg ? '<div class="err">' + esc(errMsg) + '</div>' : '') +
    '</div></div>';
  var go = $('go');
  if (codeStep) {
    $('code').focus();
    $('back').onclick = function () { renderLogin(); };
    $('code').oninput = function () { if (this.value.replace(/\D/g, '').length === 6) go.click(); };
    go.onclick = function () {
      go.disabled = true; go.textContent = 'Prüfe …';
      var device = (navigator.userAgent.match(/iPad|iPhone|Android|Macintosh|Windows/) || ['Gerät'])[0];
      call('verifyCode', { email: S.email, code: $('code').value, device: device })
        .then(function (r) { S.token = r.token; setStore('cdg_token', r.token); setUrlKey(r.token); tryTokens([r.token], 0); })
        .catch(function (e) { renderLogin('code', e.message); });
    };
  } else {
    $('mail').onkeydown = function (e) { if (e.key === 'Enter') go.click(); };
    go.onclick = function () {
      S.email = $('mail').value.trim();
      go.disabled = true; go.textContent = 'Sende Code …';
      call('requestCode', { email: S.email })
        .then(function () { renderLogin('code'); })
        .catch(function (e) { renderLogin(null, e.message); });
    };
  }
}

  };

    b('start', 'Start', '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>') +
    b('mitteilungen', 'Mitteilungen', '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>') +
    b('profil', 'Profil', '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>') +
    '</nav>';
}
function go(page, tile) { if (S.me && S.me.nurBh && page === 'tile') tile = 'bh'; if (page === 'start') window.__home = true; S.page = page; S.tile = tile || null; render(); window.scrollTo(0, 0); }
function render() {
  if (!S.me) { pushBridge(null); return renderLogin(); }
  pushBridge(S.me.id);
  if (window.__sp && S.me.rs && S.me.rs.geraet) { window.__sp = false; window.__home = true; return openSPD(); }   // Vers2-77: Wechsel-Knopf „Schichtplan ›“ aus Reservierungen/Abrechnung
  if (window.__ev && S.me.rs && S.me.rs.zugang && S.me.rs.url) { var evq = window.__ev; window.__ev = null; return openRS('rsV:' + evq); }   // Vers2-114: Push „Reminder Event“ → direkt zum Event
  // Vers2.45: Restaurant-iPad zeigt nur Reservierungen & Events
  // Vers2.64: Restaurant-iPad → direkt zur Reservierungs-Seite, aber nicht mehr, wenn es mit „‹ Start“ (?h=1) zurückkommt oder in der Abrechnung ist
  // Vers2-83: kein automatisches Öffnen von Reservierungen/Abrechnung mehr – das Restaurant-Gerät landet beim Laden/Aktualisieren immer auf der Startseite
  document.body.classList.toggle('rsfull', /^rs/.test(S.page));
  var p = S.page, html = '';
  if (p === 'start') html = pageStart();
  else if (p === 'tile') html = pageTile();
  else if (p === 'mitteilungen') html = pageMsgs();
  else if (p === 'neu') html = pageNew();
  else if (p === 'profil') html = pageProfil();
  else if (p.indexOf('inv') === 0) html = pageInv();
  else if (/^(hr|sp)/.test(p)) html = pageHRX();
  else if (/^(cl|br|bh|tk)/.test(p)) html = pageM3();
  else if (/^pj/.test(p)) html = pagePJ();
  else if (/^tm/.test(p)) html = pageTM();
  else if (/^(fb|apA)/.test(p)) html = pageFB();
  else if (/^au/.test(p)) html = pageAU();
  else if (/^ag/.test(p)) html = pageAG();
  else if (/^ob/.test(p)) html = pageOB();
  else if (/^al/.test(p)) html = pageAL();
  else if (/^gv/.test(p)) html = pageGV();
  else if (/^rz/.test(p)) html = pageRZ();
  else if (/^finB/.test(p)) html = pageFINB();
  else if (/^kue/.test(p)) html = pageKU();
  else if (/^nz/.test(p)) html = pageNZ();
  else if (/^abr/.test(p)) html = pageABR();
  else if (/^rs/.test(p)) html = pageRS();
  if (S.viewAs && typeof vaBanner === 'function') html = vaBanner() + html;
  $('app').innerHTML = '<div class="wrap' + (p === 'spP' || p === 'hrP' ? ' wide' : '') + (p === 'tile' && S.tile === 'zp' ? ' zpw' : '') + (/^rs/.test(p) ? ' rsw' : '') + '">' + html + '<footer class="appfoot">Entwickelt von Haney · © 2026 Creating Happiness<br><span class="appvers">' + APP_IDX_VERS + (S.me && S.me.codeVers ? ' · ' + S.me.codeVers.replace(/^Vers/, 'Code ') : '') + ' · ' + (S.me && S.me.codeStand ? S.me.codeStand : APP_IDX_STAND) + '</span><br><span class="appvers">' + diagTxt() + '</span></footer></div>' + nav();
  if (p === 'neu') bindNew();
  if (p === 'mitteilungen') msgAnhAll();
  document.body.classList.toggle('spfull', (p === 'spP' || p === 'hrP') && !!(typeof HRD !== 'undefined' && HRD.spFull));
  if (p.indexOf('inv') === 0 && S.inv && S.inv.sort) sortInit();
}

/* ---------- Seiten ---------- */
var ICON = { gvd: ['🎁', '#F7E6DD'], spd: ['📅', '#E2EEE9'], hr: ['👤', '#E2EEE9'], ap: ['🧰', '#F7E6DD'], wi: ['📘', '#E5ECF7'], fu: ['📊', '#34322D'], zp: ['🍜', '#DCEEEA'], rs: ['🪑', '#EFE4F6'], fin: ['💶', '#E2EEE9'], rcl: ['🍜', '#F7E6DD'] };

  }).join('');
  var zus = ((me.rs && me.rs.zus) || []).map(function (z) {   // Vers2.57: Event zugesagt – bleibt, bis die Person darauf klickt

  var tiles = (typeof startTiles === 'function' ? startTiles(me.tiles) : me.tiles).map(function (t) {
    var ic = ICON[t.k] || ['•', '#eee'];
    return '<button class="tile' + (t.dark ? ' dark' : '') + '" onclick="' + (t.k === 'ab' ? 'openABR(\'abrT\')' : t.k === 'fin' ? 'openFIN()' : t.k === 'rcl' ? 'openRCL()' : t.k === 'spd' ? 'openSPD()' : 'go(\'tile\',\'' + t.k + '\')') + '"><span class="ic" style="background:' + ic[1] + '">' + ic[0] + '</span>' + (t.badge ? '<span class="rbadge rtile" aria-label="' + t.badge + ' offen">' + t.badge + '</span>' : '') + '<span><span class="t">' + esc(t.name) + '</span><br><span class="s">' + esc(t.sub) + '</span></span></button>';
  }).join('');
  if (me.nurBh) return '<div class="top"><div><div class="muted" style="font-size:14px;font-weight:600">' + esc(d) + '</div><h1>Hallo ' + esc(me.alias || me.vorname) + '</h1></div>' +
    '<button class="avatar" onclick="go(\'profil\')">' + esc(initials(me)) + '</button></div>' +
    '<section class="today"><h2 style="padding:10px 0 4px">Heute</h2>' + rows + '</section><div class="tiles">' + tiles + '</div>';
  if (dev) {   // Vers2-81: Restaurant-Gerät – rechts „Heute im Dienst“ aller Restaurants statt „Meine Woche“
    var T = (S.today && S.today.team) || [];
    var dienst = T.length ? T.map(function (x) {
      return '<div style="margin-top:8px"><b style="font-size:16px;color:var(--ink)">' + esc(SITES[x.site] || x.site) + '</b><div style="font-size:14px;line-height:1.5;margin-top:2px"><span class="muted">Morgenschicht</span> ' + (x.ms.length ? esc(x.ms.join(', ')) : '–') + '<br><span class="muted">Abendschicht</span> ' + (x.as.length ? esc(x.as.join(', ')) : '–') + '</div></div>';
    }).join('') : '<span class="vhint">Heute sind keine Schichten eingetragen.</span>';
    return '<div class="top"><div><div class="muted" style="font-size:14px;font-weight:600">' + esc(d) + '</div><h1>Hallo ' + esc(me.alias || me.vorname) + '</h1></div>' +
      '<button class="avatar" onclick="go(\'profil\')">' + esc(initials(me)) + '</button></div>' +
      '<div class="grid2"><section class="today"><h2 style="padding:10px 0 4px">Heute</h2>' + rows + '</section>' +
      '<section class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:2px"><h2>Heute im Dienst</h2>' + dienst + planBtn(S.today.monday, S.today.kw) + '</section></div>' +
      '<div class="tiles">' + tiles + '</div>';
  }
  return '<div class="top"><div><div class="muted" style="font-size:14px;font-weight:600">' + esc(d) + '</div><h1>Hallo ' + esc(me.alias || me.vorname) + '</h1></div>' +
    '<button class="avatar" onclick="go(\'profil\')">' + esc(initials(me)) + '</button></div>' +

    (me.can && me.can.schichtplan === false ? '<section class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:6px"><h2>Meine Woche</h2><span class="vhint">Schichtplan für die Küche: hier bald verfügbar.</span></section></div>' + (me.can.berichtsheft ? '<button class="hrlink bhtop" style="margin-top:12px" onclick="goAny(\'bhA\')"><span class="vtx"><b>Mein Berichtsheft</b><span>Woche eintragen & unterschreiben</span></span>' + chev() + '</button>' : '') + '<div style="display:none">' : '') + '<section class="card" style="padding:14px 16px;display:flex;flex-direction:column;gap:8px"><h2>Meine Woche</h2>' +
    weekHtml0() + planBtn(S.today.monday, S.today.kw) + (teamRechts ? teamHeuteBox() : '') + nextWeekHtml(true) + '</section></div>' +
    '<div class="tiles">' + tiles + '</div>';
}

function planBtn(monday, kw) {

function nextWeekHtml(btn) {

    return '<div><b>' + esc(d.tag) + '</b><span>' + d.items.map(function (i) { return esc(SITES[i.site] || i.site) + (i.zeit ? ' · ' + esc(i.zeit) : '') + (i.task ? ' · ' + esc(i.task) : '') + (i.extra ? ' · ' + esc(i.extra) : '') + (i.abruf ? ' (auf Abruf)' : ''); }).join('<br>') + '</span></div>';
  }).join('') + '</div>' : '<div class="muted" style="font-size:14px;line-height:1.5">Nächste Woche stehst du nicht im Schichtplan.</div>';
  return '<div class="nxwk"><h3>Nächste Woche · KW ' + esc(n.kw) + ' <span>' + esc(n.label) + '</span></h3>' + body + (btn ? planBtn(n.monday, n.kw) : '') + '</div>';

function weekHtml() {

}
function weekHtml0() {

  }).join('') + '</div><div class="muted" style="font-size:11px">aus dem Schichtplan (Reiter ' + esc(S.today.tab) + ')</div>';

function pageTile() {
  if (S.tile === 'ap') return pageAP();
  if (S.tile === 'hr') return pageHR();
  if (S.tile === 'zp') return pageZP();
  if (S.tile === 'wi') return pageWI();
  var t = S.me.tiles.filter(function (x) { return x.k === S.tile; })[0];
  if (!t) return pageStart();
  var groups = t.groups.map(function (g) {
    var items = g.items.map(function (i) {
      var live = !!i.go;
      var act = i.go && i.go.indexOf('inv') === 0 ? 'openInv(\'' + i.go + '\')' : i.go ? 'goAny(\'' + i.go + '\')' : 'go(\'' + i.go + '\')';
      return '<button class="li" ' + (live ? 'onclick="' + act + '"' : 'disabled style="cursor:default"') + '>' +
        '<div class="tx"><b>' + esc(i.name) + '</b><span>' + esc(i.sub) + '</span></div>' + (i.badge ? '<span class="rbadge" aria-label="' + i.badge + ' offen">' + i.badge + '</span>' : '') +
        (live ? '<span style="color:var(--soft);font-size:20px">›</span>' : '<span class="badge" style="background:#F1EDE6;color:var(--muted)">' + (i.modul === 'bald' ? 'bald verfügbar' : 'kommt in Modul ' + i.modul) + '</span>') +
        '</button>';
    }).join('');
    return '<div class="group">' + (g.name ? '<h2>' + esc(g.name) + '</h2>' : '') + '<div class="card list">' + items + '</div></div>';
  }).join('');
  return '<button class="back" onclick="go(\'start\')">‹ Start</button><h1>' + esc(t.name) + '</h1>' + groups;
}

    var open = S.open[m.id];
    return '<div class="card msg' + (m.gelesen ? '' : ' unread') + '">' +

function V(id) { return S.inv.vals[id] || (S.inv.vals[id] = { b: null, g: false, o: null }); }

}

/* Vers2.46: Getränke – Zählung bleibt stehen, „Neu zählen“ / „Ändern“, letzte 4 Inventuren */

function gCore(items) {

  items.forEach(function (x) { if ((x.last != null || x.lastGenug) && (!best || (x.lastTs || 0) > (best.lastTs || 0))) best = x; });
  if (!best) return st;
  items.forEach(function (x) {
    if ((x.last != null || x.lastGenug) && Math.abs((x.lastTs || 0) - (best.lastTs || 0)) < 2 * 3600000) S.inv.vals[x.id] = { b: x.lastGenug ? null : x.last, g: !!x.lastGenug, o: x.lastBestell != null ? x.lastBestell : null };
  });
  st.gView = true; st.gLast = { ts: best.lastTs || 0, datum: best.lastDatum || '', von: best.lastVon || '' };
  return st;
}
function gApply(st) { S.inv.gView = st.gView; S.inv.gLast = st.gLast; S.inv.korrTs = st.korrTs; S.inv.prev = st.prev; }
/* Vers2-51: Asia-Ware wie Getränke – Zählung bleibt stehen; Bar & Service und Küche haben je ihre eigene Zählung */

function pStock(it) {

    if (!(k in it.sites)) { chips.push(['', k + ' nicht im Verkauf']); return; }
    var b = it.sites[k], so = (it.soll || {})[k];
    if (b === '' || b == null) { chips.push(['', k + ' noch nicht gezählt']); return; }

    var miss = Math.max(0, so - b); total += miss;

/* ---------- Schichtwünsche: Wunsch / Nicht da / Erst ab … (+ Restaurant für Service & Bar) ---------- */
var VSITES = ['CD', 'RC', 'IF'];
function vParse(v) {
  var p = String(v || '').split('|'), c = p[0] || '', ab = '';
  if (c.charAt(0) === 'a') { ab = c.slice(1); c = 'a'; }
  return { c: c, ab: ab, sites: p[1] ? p[1].split(',') : [] };
}
function vCompose(o) {
  if (!o.c) return '';
  var c = o.c === 'a' ? 'a' + o.ab : o.c;
  return c + (o.c !== 'n' && o.c !== 'f' && o.sites && o.sites.length ? '|' + o.sites.join(',') : '');
}
function vLabel(v, short) {
  var o = vParse(v);
  var base = o.c === 'w' ? 'Wunsch' : o.c === 'n' ? (short ? 'Nicht da' : 'Nicht verfügbar') : o.c === 'f' ? 'Lieber frei' : o.c === 'a' ? 'ab ' + o.ab : '–';
  return base + (o.sites.length ? ' · ' + o.sites.join('/') : '');
}
function vTimes(slot) { return slot === 'M' ? ['12:00'] : ['17:00', '17:30', '18:00', '18:30']; }
function vTap(day, slot) {
  var k = day + '-' + slot, cur = HRD.v.edit[k] || '';
  HRD.vp = Object.assign({ day: day, slot: slot }, vParse(cur));
  vPickRender();
}
function vPickRender() {
  var p = HRD.vp, v = HRD.v, chip = function (on, txt, act) { return '<button class="' + (on ? 'on' : '') + '" onclick="' + act + '">' + txt + '</button>'; };
  var h = '<div class="overlay" onclick="closeLayer(event)"><div class="sheet"><h1 style="font-size:20px">' + TAGE[p.day] + ' ' + esc(v.dates[p.day]) + ' · ' + (p.slot === 'M' ? 'Morgen 10–15' : 'Abend 17–23') + '</h1>' +
    '<div class="vpick">' + chip(p.c === 'w', 'Wunsch', 'vPickSet(\'w\')') + chip(p.c === 'n', 'Nicht da', 'vPickSet(\'n\')') + chip(p.c === 'a', 'Erst ab …', 'vPickSet(\'a\')') + chip(p.c === 'f', 'Lieber frei', 'vPickSet(\'f\')') + chip(!p.c, 'leer', 'vPickSet(\'\')') + '</div>';
  if (p.c === 'a') h += '<div class="vpf"><span>Ab wann kannst du?</span><div class="vpchip">' + vTimes(p.slot).map(function (t) { return chip(p.ab === t, t, 'HRD.vp.ab=\'' + t + '\';vPickRender()'); }).join('') + '</div></div>';
  if ((p.c === 'w' || p.c === 'a') && v.canSite) h += '<div class="vpf"><span>In welchem Restaurant? <small style="font-weight:600;color:var(--muted)">optional · nichts gewählt = egal</small></span><div class="vpchip">' +
    VSITES.map(function (s) { return chip(p.sites.indexOf(s) >= 0, SITES[s], 'vPickSite(\'' + s + '\')'); }).join('') + '</div></div>';
  if (p.c === 'w' || p.c === 'a') h += '<button class="btn" ' + (p.c === 'a' && !p.ab ? 'disabled' : '') + ' onclick="vPickOk()">Übernehmen</button>';
  h += '<button class="btn ghost" style="margin-top:8px" onclick="closeLayer()">Abbrechen</button></div></div>';
  $('layer').innerHTML = h;
}
function vPickSet(c) {
  var p = HRD.vp; p.c = c;
  if (c !== 'a') p.ab = '';
  if (c === 'n' || c === 'f' || !c || (c === 'w' && !HRD.v.canSite)) return vPickOk();
  vPickRender();
}
function vPickSite(s) { var a = HRD.vp.sites, i = a.indexOf(s); if (i >= 0) a.splice(i, 1); else a.push(s); if (a.length === 3) a.length = 0; vPickRender(); }

function m3Photo(inp, cb) {
  var f = inp.files && inp.files[0]; if (!f) return;
  var img = new Image(), url = URL.createObjectURL(f);
  img.onload = function () {
    var sc = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    var d = c.toDataURL('image/jpeg', 0.78); URL.revokeObjectURL(url); cb(d);
  };

  img.src = url;
}

function clVideoPick(inp) {
  var f = inp.files && inp.files[0]; if (!f) return;

  M3D.clf.video = f; M3D.clf.vprog = null; render();
}
/* Video in Stücken zu je 4 MB direkt in Drive hochladen */
function clVideoUpload(f) {
  var CH = 4 * 1048576, n = Math.ceil(f.size / CH), uid = (Date.now().toString(36) + Math.random().toString(36).slice(2, 10)).slice(0, 20);
  var i = 0;
  return new Promise(function (resolve, reject) {
    var next = function () {
      if (i >= n) return resolve({ uid: uid });
      var rd = new FileReader();
      rd.onload = function () {
        call('clChunk', { uid: uid, i: i, size: f.size, mime: f.type || 'video/mp4', data: String(rd.result).split(',')[1] || '' }).then(function () {
          i++; M3D.clf.vprog = Math.round(i / n * 100); var b = $('clsend'); if (b) b.textContent = 'Video lädt hoch … ' + M3D.clf.vprog + ' %'; next();
        }).catch(reject);
      };
      rd.onerror = function () { reject(new Error('Video konnte nicht gelesen werden.')); };
      rd.readAsDataURL(f.slice(i * CH, Math.min(f.size, (i + 1) * CH)));
    };
    next();
  });
}
function clVideoShow(id) {
  $('layer').innerHTML = '<div class="overlay" onclick="closeLayer(event)"><div class="sheet" style="text-align:center"><div class="spin" style="margin:30px auto"></div></div></div>';

  var fix = function (o, avail) { o = o || {}; var ord = (o.order || []).filter(function (k) { return avail.indexOf(k) >= 0; }); var had = ord.length; avail.forEach(function (k) { if (ord.indexOf(k) < 0) ord.push(k); }); if (had) ['zp', 'bh', 'sp'].forEach(function (k) { var i = ord.indexOf(k); if (i >= had) { ord.splice(i, 1); ord.unshift(k); } }); return { order: ord, hidden: (o.hidden || []).filter(function (k) { return avail.indexOf(k) >= 0; }) }; };

  return out.length ? out : tiles;
}

/* ℮ (geschätzte Menge) gibt es in der Standardschrift nicht – DejaVu nachladen, sonst „e“ */
function ryLoadEFont() {

    var b = new Uint8Array(buf), s = '', i; for (i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));

}
function ryPdf() {
  var E = ZPD.et, R = E.rylex, L = ryList();
  if (!L.length) return;
  $('layer').innerHTML = '<div class="overlay" onclick="closeLayer(event)"><div class="sheet"><div class="spin" style="margin:30px auto"></div></div></div>';
  Promise.all([etLoadPdfLib(), ryLoadEFont()]).then(function (res) {
    var lib = res[0], font = res[1];
    var doc = new lib.jsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });
    if (font) { try { doc.addFileToVFS('DejaVuSans.ttf', font); doc.addFont('DejaVuSans.ttf', 'DejaVu', 'normal'); } catch (e) { font = null; } }
    var W = 148.5, H = 105, pos = (E.startR || 1) - 1;
    var center = function (cx, y, parts, size) {   // parts: [[text, bold], …] mittig in einer Zeile
      doc.setFontSize(size); var w = 0;
      parts.forEach(function (p) { doc.setFont('helvetica', p[1] ? 'bold' : 'normal'); w += doc.getTextWidth(p[0]); });
      var x = cx - w / 2;
      parts.forEach(function (p) { doc.setFont('helvetica', p[1] ? 'bold' : 'normal'); doc.text(p[0], x, y); x += doc.getTextWidth(p[0]); });
    };
    var wrap = function (label, text, size, maxW) {   // fett beginnende Absätze umbrechen
      doc.setFontSize(size); doc.setFont('helvetica', 'normal');
      return doc.splitTextToSize(label + text, maxW).map(function (l, k) { return k === 0 && label ? [[label, true], [l.slice(label.length), false]] : [[l, false]]; });
    };
    L.forEach(function (it) {
      if (pos >= 4) { doc.addPage('a4', 'landscape'); pos = 0; }
      var x0 = (pos % 2) * W, y0 = Math.floor(pos / 2) * H, cx = x0 + W / 2, rgb = etHex(it.farbe);
      // Titel: Farbe wie Vorlage, dunkler Rand + leichter Schatten
      var t = etTxt(it.titel), fs = 30;
      doc.setFont('helvetica', 'bold'); doc.setFontSize(fs);
      while (fs > 16 && doc.getTextWidth(t) > W - 16) { fs -= 1; doc.setFontSize(fs); }
      doc.setTextColor(160, 160, 160); doc.text(t, cx + 0.45, y0 + 19.45, { align: 'center' });
      doc.setTextColor(rgb[0], rgb[1], rgb[2]); doc.setDrawColor(30, 29, 26); doc.setLineWidth(0.25);
      doc.text(t, cx, y0 + 19, { align: 'center', renderingMode: 'fillThenStroke' });
      doc.setTextColor(0, 0, 0);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(14); doc.text('für ' + etTxt(R.kunde), cx, y0 + 31, { align: 'center' });
      // Beschreibung, Zutaten, Nährwerte, Allergene (wird bei langem Text kleiner)
      var size = 8, lines;
      var build = function (sz) {
        var out = [[[etTxt(it.beschr), true]]];
        out = out.concat(wrap('Hauptzutaten: ', etTxt(it.zut), sz, 112));
        if (it.nw) out = out.concat(wrap('Nährwerte je ' + it.je + ': ', etTxt(it.nw), sz, 112));
        out = out.concat(wrap('Allergene: ', etTxt(it.allerg || 'keine'), sz, 112));
        return out;
      };
      lines = build(size); while (lines.length * size * 0.42 > 18.5 && size > 6) { size -= 0.5; lines = build(size); }
      lines.forEach(function (l, k) { center(cx, y0 + 43 + k * size * 0.42, l, size); });
      // farbiges Feld: Prod. Datum / Hergestellt von / Inhalt
      doc.setFillColor(rgb[0], rgb[1], rgb[2]); doc.rect(x0 + 22, y0 + 64.5, 103, 15, 'F');
      doc.setDrawColor(0, 0, 0); doc.setLineWidth(0.25); doc.setFont('helvetica', 'normal'); doc.setFontSize(7);
      doc.text('Prod. Datum', x0 + 45, y0 + 70.3, { align: 'right' }); doc.line(x0 + 47.5, y0 + 71.6, x0 + 88, y0 + 71.6);
      doc.text('Hergestellt von', x0 + 45, y0 + 77.6, { align: 'right' }); doc.line(x0 + 47.5, y0 + 78.9, x0 + 88, y0 + 78.9);
      doc.text('Inhalt', x0 + 109.5, y0 + 70, { align: 'center' });
      doc.setFontSize(12); var iw = doc.getTextWidth(R.inhalt + ' ');
      var ew = 2.6, ix = x0 + 109.5 - (iw + ew) / 2;
      doc.text(R.inhalt + ' ', ix, y0 + 77.3);
      if (font) { doc.setFont('DejaVu', 'normal'); doc.text('℮', ix + iw, y0 + 77.3); doc.setFont('helvetica', 'normal'); } else doc.text('e', ix + iw, y0 + 77.3);
      doc.line(x0 + 95, y0 + 78.9, x0 + 124, y0 + 78.9);
      // Lagerhinweis + Hersteller
      doc.setFontSize(7); center(cx, y0 + 84.6, [['Lagerhinweis:', true]], 7);

      center(cx, y0 + 95.6, [['Hersteller/ Imverkehrbringer:', true]], 7);
      center(cx, y0 + 98.8, [[etTxt(E.firma), false]], 7);
      pos++;

    var name = 'Etiketten_Rylex_' + new Date().toISOString().slice(0, 10) + '.pdf';
    $('layer').querySelector('.sheet').innerHTML = '<h1 style="font-size:20px">Rylex-Etiketten fertig</h1><p class="vhint">' + L.length + ' Etiketten · A4 quer · beim Drucken „Tatsächliche Größe / 100 %“ wählen' + (font ? '' : ' · Hinweis: Das ℮-Zeichen konnte nicht geladen werden und ist als „e“ gedruckt.') + '</p>' +
      '<a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="' + url + '" download="' + name + '" target="_blank">Öffnen / speichern</a><button class="btn ghost" style="margin-top:8px" onclick="closeLayer()">Schließen</button>';
  }).catch(function (e) { closeLayer(); toast(e.message); });

/* ---------- Datei lesen (xls, xlsx, csv) ---------- */
function nbgLoadXlsx(cb) {
  if (window.XLSX) return cb();
  var s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  s.onload = cb; s.onerror = function () { toast('Der Datei-Leser konnte nicht geladen werden. Bitte Internet prüfen.'); };
  document.head.appendChild(s);
}
function nbgReadBook(file, cb) {
  nbgLoadXlsx(function () {
    var fr = new FileReader();
    fr.onload = function () { var wb; try { wb = XLSX.read(new Uint8Array(fr.result), { type: 'array', codepage: 65001 }); } catch (e) { return cb(new Error('Die Datei „' + file.name + '“ lässt sich nicht lesen.')); } cb(null, wb); };
    fr.onerror = function () { cb(new Error('Die Datei „' + file.name + '“ lässt sich nicht öffnen.')); };
    fr.readAsArrayBuffer(file);
  });
}
/** Artikel + verkaufte Portionen aus einem Cukcuk-/Uber-Eats-/Wolt-Export. Spalten werden am Namen erkannt. */
function nbgParseExport(wb, fname) {
  var ws = wb.Sheets[wb.SheetNames[0]];
  var rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' });
  var hi = -1, cn = -1, cq = -1, i, j;
  for (i = 0; i < rows.length && i < 40 && hi < 0; i++) {
    var a = -1, b = -1;
    for (j = 0; j < rows[i].length; j++) {
      var t = String(rows[i][j]).trim().toLowerCase();
      if (a < 0 && (t === 'artikel' || t === 'artikelname')) a = j;
      if (b < 0 && (t === 'vk.mg' || t === 'vk.mg.' || t === 'verkaufte artikel')) b = j;
    }
    if (a >= 0 && b >= 0) { hi = i; cn = a; cq = b; }
  }
  if (hi < 0) throw new Error('In „' + fname + '“ fehlen die Spalten „Artikel“ und „Vk.Mg“ bzw. „Verkaufte Artikel“.');
  var sum = {}, order = [];
  for (i = hi + 1; i < rows.length; i++) {
    var nm = String(rows[i][cn] == null ? '' : rows[i][cn]).trim(), q = Number(String(rows[i][cq]).replace(',', '.'));
    if (!nm || isNaN(q) || q <= 0) continue;
    if (!sum.hasOwnProperty(nm)) { sum[nm] = 0; order.push(nm); }
    sum[nm] += q;
  }
  var head = rows.slice(0, 12).map(function (r) { return r.join(' '); }).join(' | ');
  var per = null, m = head.match(/Von\s+(\d{2})\/(\d{2})\/(\d{4})\s+bis\s+(\d{2})\/(\d{2})\/(\d{4})/i), f = String(fname).match(/(\d{4}-\d{2}-\d{2})\D+(\d{4}-\d{2}-\d{2})/);
  if (m) per = [m[3] + '-' + m[2] + '-' + m[1], m[6] + '-' + m[5] + '-' + m[4]]; else if (f) per = [f[1], f[2]];
  return { name: fname, rows: order.map(function (n) { return [n, sum[n]]; }), per: per };
}
function nbgUpl(q, el) {
  var f = el.files && el.files[0]; if (!f) return;
  nbgReadBook(f, function (err, wb) {
    if (err) return toast(err.message);
    try { ZPD.n.files[q] = nbgParseExport(wb, f.name); } catch (e) { return toast(e.message); }
    render();
  });
}
function nbgDel(q) { delete ZPD.n.files[q]; render(); }

/* ---------- Zuordnung Kassenname → Gericht, Rezept → Verbrauch ---------- */
function nbgFind(q, name) {
  var d = ZPD.data, k = nbgNorm(name), gid = (d.nbg.kassen || {})[k];
  if (gid === '-' || ZPD.n.ign[k]) return { ign: true };
  if (gid && d.byId[gid]) return { g: d.byId[gid], how: 'gespeichert' };
  var c = d.gerichte.filter(function (g) { return nbgNorm(g.name) === k; });
  if (!c.length) return null;
  var pref = q === 'cd' ? [/d.?ung/i, /nbg|ramencado/i, /franchise/i] : [/nbg|ramencado/i, /franchise/i, /d.?ung/i];
  for (var i = 0; i < pref.length; i++) { var h = c.filter(function (g) { return pref[i].test(g.typ); })[0]; if (h) return { g: h, how: 'automatisch' }; }
  return { g: c[0], how: 'automatisch' };
}
function nbgRows() {
  var out = [];
  NBG_Q.forEach(function (q) {
    var f = ZPD.n.files[q[0]]; if (!f) return;
    f.rows.forEach(function (r) { var h = nbgFind(q[0], r[0]); out.push({ q: q[0], name: r[0], qty: r[1], g: h && h.g, how: h ? (h.ign ? 'ignoriert' : h.how) : '', ign: !!(h && h.ign) }); });
  });
  return out;
}
/** Komponenten, die als Zentralproduktions-/Eigenproduktions-Artikel bestellbar sind (Produkte mit Bestellfeldern) */
function nbgArtMap() { var m = {}; (ZPD.data.artikel || []).forEach(function (a) { if (a.typ === 'p') m[zpKey(a.name)] = a; }); return m; }
function nbgPortionen(rows) { var P = {}; rows.forEach(function (r) { if (r.g) P[r.g.id] = (P[r.g.id] || 0) + r.qty; }); return P; }
function nbgVerbrauch(P) {
  var art = nbgArtMap(), V = {};
  Object.keys(P).forEach(function (gid) {
    var g = ZPD.data.byId[gid]; if (!g) return;
    g.lines.forEach(function (l) {
      var A = art[zpKey(l[0])]; if (!A) return;
      var p = ZPD.data.byId[A.id], dichte = (p && p.raw && p.raw.dichte) || 1, f = A.unit === 'Liter' ? 1 / dichte : 1;
      V[A.k] = (V[A.k] || 0) + P[gid] * (l[1] || 0) / 1000 * f;
    });
  });
  return V;
}
/* ---- Bestell-Schritt, Bestand, Rechnen (Vers2-50) ---- */
function nbgStep(A) { return A.step && A.step > 0 ? A.step : 1; }
function nbgDec(s) { var p = String(s).split('.')[1]; return p ? p.length : 0; }
function nbgUp(x, s) { return Number((Math.ceil(x / s - 1e-9) * s).toFixed(nbgDec(s))); }
function nbgR3(x) { return Math.round(x * 1000) / 1000; }
function nbgFmtN(x) { return String(nbgR3(x)).replace('.', ','); }
function nbgMg(m) { var s = Number(m).toFixed(3); if (/0$/.test(s)) s = s.slice(0, -1); return s.replace('.', ','); }
/** Rest aus dem letzten abgerechneten Zeitraum vor „von“ (kommt aus der Monatsrechnung) */
function nbgPrevRest() {
  var N = ZPD.n, best = null;
  (ZPD.data.nbg.monat || []).forEach(function (m) { if (m.bis < N.von && (!best || m.bis > best.bis)) best = m; });
  return best && best.rest ? best.rest : {};
}
function nbgBestand(A) { var r = ZPD.n.rest[A.k]; return (r === '' || r == null) ? (nbgPrevRest()[A.k] || 0) : nbgNum(r); }
/** Gesamtmenge auf die Wochen verteilen: im Verhältnis der berechneten Wochenmengen, in ganzen Schritten (sonst auf 0,001) */
function nbgVerteile(total, w, step) {
  var u = step || 1, tu = total / u, i;
  if (Math.abs(tu - Math.round(tu)) > 1e-6) { u = 0.001; tu = total / u; }
  tu = Math.round(tu);
  var s = w.reduce(function (a, x) { return a + x; }, 0);
  if (!w.length) return [];
  var raw = w.map(function (x) { return s ? tu * x / s : tu / w.length; });
  var out = raw.map(function (x) { return Math.floor(x); }), fl = out.reduce(function (a, x) { return a + x; }, 0);
  var idx = raw.map(function (x, k) { return [x - Math.floor(x), k]; }).sort(function (a, b) { return b[0] - a[0]; });
  for (i = 0; i < tu - fl && i < idx.length; i++) out[idx[i][1]]++;
  return out.map(function (x) { return Number((x * u).toFixed(nbgDec(u))); });
}
/** Je Woche: Bedarf = Verbrauch × Umsatzanteil × 1,02. Reicht der Bestand, wird nichts bestellt; sonst wird die Lücke
    auf den nächsten Schritt AUFGERUNDET (lieber etwas zu viel). Was übrig bleibt, geht in die nächste Woche und in den nächsten Zeitraum. */
function nbgOrd(list) {
  var rk = {}; ((ZPD.data.nbg && ZPD.data.nbg.reihe) || []).forEach(function (k, i) { rk[k] = i; });
  return list.map(function (x, i) { return [x, i]; }).sort(function (a, b) {
    var ra = rk.hasOwnProperty(a[0].A.k) ? rk[a[0].A.k] : 1e6 + a[1], rb = rk.hasOwnProperty(b[0].A.k) ? rk[b[0].A.k] : 1e6 + b[1]; return ra - rb;
  }).map(function (x) { return x[0]; });
}
/** Je Woche: Bedarf = Verbrauch × Umsatzanteil × 1,02. Reicht der Bestand, wird nichts bestellt; sonst wird die Lücke
    auf den nächsten Schritt AUFGERUNDET (lieber etwas zu viel). Was übrig bleibt, geht in die nächste Woche und in den nächsten Zeitraum.
    Die Wochenmenge auf der Rechnung kann von Hand geändert werden (N.wk), die Abholung je Woche steht in N.pick. */
function nbgResult() {
  var N = ZPD.n, rows = nbgRows(), P = nbgPortionen(rows), V = nbgVerbrauch(P), W = nbgWeeks(), T = nbgUTot(), res = [];
  var sum = function (a) { return a.reduce(function (s, x) { return s + x; }, 0); };
  (ZPD.data.artikel || []).forEach(function (A) {
    if (!V.hasOwnProperty(A.k)) return;
    var st = nbgStep(A), b0 = nbgBestand(A), stock = b0;
    var need = W.map(function (w) { return T ? V[A.k] * nbgUKw(w.key) / T * (1 + NBG_AUFSCHLAG) : 0; });
    var ord = need.map(function (n) { var sh = n - stock, o = sh > 1e-9 ? nbgUp(sh, st) : 0; stock = stock + o - n; return o; });
    var per = W.map(function (w, i) {
      var ov = N.wk[A.k + '|' + w.key], pk = N.pick[A.k + '|' + w.key], has = !(ov === '' || ov == null);
      return { w: w.w, key: w.key, calc: nbgR3(ord[i]), n: has ? nbgR3(nbgNum(ov)) : nbgR3(ord[i]), ed: has && nbgR3(nbgNum(ov)) !== nbgR3(ord[i]), pick: (pk === '' || pk == null) ? '' : String(pk) };
    });
    var menge = nbgR3(sum(per.map(function (x) { return x.n; }))), anyPick = per.some(function (x) { return x.pick !== ''; });
    res.push({ A: A, verb: V[A.k], st: st, b0: b0, kasse: nbgR3(sum(ord)), menge: menge, rest: nbgR3(Math.max(0, b0 + menge - sum(need))), perKw: per,
      edited: per.some(function (x) { return x.ed; }), anyPick: anyPick, pickSum: nbgR3(sum(per.map(function (x) { return nbgNum(x.pick); }))) });
  });
  return nbgOrd(res);
}
function nbgUnit(A) { return A.unit === 'Liter' ? 'Liter' : A.unit === 'Stk' ? 'Stk' : 'KG'; }
function nbgUnitShort(A) { return A.unit === 'Liter' ? 'L' : A.unit === 'Stk' ? 'Stk' : 'kg'; }
/** inv = true: so steht es auf der Rechnung (Wochen ohne Lieferung fehlen); sonst auch die Wochen ohne Bestellung */
function nbgKwLines(r, inv) {
  return r.perKw.filter(function (k) { return !inv || k.n > 0; }).map(function (k) {
    return k.n > 0 ? '<div class="nbgkw">Lieferung in KW ' + k.w + ': ' + nbgFmtN(k.n) + ' ' + nbgUnit(r.A) + '</div>' : '<div class="nbgkw dim">KW ' + k.w + ': keine Lieferung, Bestand reicht</div>';
  }).join('');
}
function nbgG(c) { var A = nbgArtMap()[zpKey(c[0])]; return c[1] + (A && A.unit === 'Liter' ? ' ml' : ' g'); }

/* ---------- Seite ---------- */

  if (!ZPD.n) return nbgVListe();
  var N = ZPD.n;
  var nav = '<aside class="nbgside"><div class="nbgnav">' + NBG_STEPS.map(function (s, i) {
    var ok = [nbgWeeks().length > 0, nbgUTot() > 0, nbgLoadedN() > 0, nbgResult().length > 0, !!N.sent][i];
    return '<button class="' + (N.step === i ? 'on ' : '') + (ok && N.step !== i ? 'ok' : '') + '" onclick="nbgGo(' + i + ')"><i>' + (ok && N.step !== i ? '✓' : i + 1) + '</i>' + s + '</button>';
  }).join('') + '</div><div class="nbgsum"><b>Zeitraum</b>' + nbgDmy(N.von) + ' – ' + nbgDmy(N.bis) + '<b>Kalenderwochen</b>' + (nbgWeeks().length ? 'KW ' + nbgWeeks().map(function (w) { return w.w; }).join(', ') : '–') +

function nbgGo(i) { ZPD.n.step = i; render(); window.scrollTo(0, 0); }

        ZPD.data.gerichte.map(function (g) { return '<option value="' + g.id + '">' + esc(g.name) + (g.typ ? ' (' + esc(g.typ) + ')' : '') + '</option>'; }).join('') + '</select></td></tr>';
